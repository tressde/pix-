<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento via Pix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #1a1d20;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .pix-badge {
      display: inline-block;
      background-color: #e6f7f5;
      color: #008069;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #111827;
    }

    .recebedor {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 24px;
    }

    .btn-copiar {
      width: 100%;
      background-color: #00a884;
      color: #ffffff;
      border: none;
      padding: 18px 20px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(0, 168, 132, 0.25);
    }

    .btn-copiar:active {
      transform: scale(0.98);
    }

    .btn-copiar.copiado {
      background-color: #111827;
      box-shadow: 0 4px 12px rgba(17, 24, 39, 0.2);
    }

    .instrucoes {
      margin-top: 24px;
      text-align: left;
      background-color: #f9fafb;
      padding: 16px;
      border-radius: 12px;
      font-size: 13.5px;
      color: #4b5563;
      line-height: 1.5;
    }

    .instrucoes strong {
      color: #111827;
      display: block;
      margin-bottom: 6px;
    }

    .instrucoes ol {
      padding-left: 18px;
    }

    .instrucoes li {
      margin-bottom: 4px;
    }

    .codigo-box {
      margin-top: 16px;
    }

    .codigo-box summary {
      font-size: 12.5px;
      color: #6b7280;
      cursor: pointer;
      user-select: none;
    }

    textarea {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      font-size: 11px;
      color: #374151;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      resize: none;
      height: 68px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="pix-badge">PIX COPIA E COLA</span>
    <h1>Pagar com Pix</h1>
    
    <!-- ALTERE O NOME DO RECEBEDOR ABAIXO -->
    <p class="recebedor">Para: <strong>Masterclima</strong></p>

    <button id="btnCopiar" class="btn-copiar" onclick="copiarPix()">
      <span id="btnTexto">Copiar código Pix</span>
    </button>

    <div class="instrucoes">
      <strong>Como pagar:</strong>
      <ol>
        <li>Toque no botão verde acima para copiar o código.</li>
        <li>Abra o aplicativo do seu banco na área <strong>Pix</strong>.</li>
        <li>Escolha <strong>Pix Copia e Cola</strong>, cole o código e digite o valor.</li>
      </ol>
    </div>

    <details class="codigo-box">
      <summary>Ver código manual</summary>
      <textarea id="codigoPix" readonly onclick="this.select()">SEU_CODIGO_PIX_COPIA_E_COLA_AQUI</textarea>
    </details>
  </div>

  <script>
    function copiarPix() {
      const codigo = document.getElementById("codigoPix").value.trim();
      const btn = document.getElementById("btnCopiar");
      const btnTexto = document.getElementById("btnTexto");

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(codigo).then(() => {
          confirmarCopia(btn, btnTexto);
        }).catch(() => {
          copiaAlternativa(codigo, btn, btnTexto);
        });
      } else {
        copiaAlternativa(codigo, btn, btnTexto);
      }
    }

    function copiaAlternativa(texto, btn, btnTexto) {
      const tempInput = document.createElement("textarea");
      tempInput.value = texto;
      tempInput.style.position = "fixed";
      tempInput.style.opacity = "0";
      document.body.appendChild(tempInput);
      tempInput.focus();
      tempInput.select();
      try {
        document.execCommand("copy");
        confirmarCopia(btn, btnTexto);
      } catch (err) {
        alert("Não foi possível copiar automaticamente. Toque em 'Ver código manual' e copie o texto.");
      }
      document.body.removeChild(tempInput);
    }

    function confirmarCopia(btn, btnTexto) {
      btn.classList.add("copiado");
      btnTexto.innerText = "✓ Código Pix copiado!";
      
      setTimeout(() => {
        btn.classList.remove("copiado");
        btnTexto.innerText = "Copiar código Pix";
      }, 3500);
    }
  </script>

</body>
</html>
